 💘", "तुम्हारे बिना मेरी चाय भी फीकी लगती है। ☕🥹", "तुम्हारी आवाज़ सुनकर दिल को सुकून मिलता है। 🎶💗", "तुमसे मिलकर लगता है किस्मत ने कुछ अच्छा किया है। 🥰"], "love_story": {"title": "राज कुमार और टीना की प्यारी-सी प्रेम कहानी ❤️", "subtitle": "दो दिल, एक एहसास और हमेशा साथ रहने का वादा 💞", "chapters": [{"title": "पहली मुलाकात 🌸", "text": "कहते हैं कुछ लोग ज़िंदगी में अचानक आते हैं, लेकिन दिल में हमेशा के लिए जगह बना लेते हैं। राज कुमार की ज़िंदगी में भी टीना कुछ ऐसे ही आई। उसकी मुस्कान में एक अलग-सी मिठास थी और उसकी बातों में ऐसा अपनापन, जो धीरे-धीरे राज कुमार के दिल के करीब होता चला गया।"}, {"title": "प्यार का एहसास 💗", "text": "धीरे-धीरे छोटी-छोटी बातें खास बनने लगीं। कभी एक प्यारा-सा मैसेज, कभी हाल पूछ लेना, तो कभी बिना वजह मुस्कुरा देना। राज कुमार को एहसास हुआ कि टीना सिर्फ उसकी पसंद नहीं, बल्कि उसके दिन की सबसे खूबसूरत वजह बन गई है।"}, {"title": "दोस्ती से बढ़कर 🫶", "text": "दोनों ने एक-दूसरे की बातें सुनना, खुशियों में मुस्कुराना और मुश्किल समय में साथ देना सीखा। उनके लिए प्यार सिर्फ बड़े-बड़े वादों का नाम नहीं था, बल्कि रोज़ की छोटी-छोटी परवाह में छिपा एक खूबसूरत एहसास था।"}, {"title": "हमेशा साथ रहने की दुआ 🌙", "text": "राज कुमार की दिल से यही ख्वाहिश थी कि टीना हमेशा खुश रहे। वह जानता था कि रिश्ते प्यार के साथ भरोसे, इज़्ज़त और समझदारी से मजबूत होते हैं। दोनों की कहानी का सबसे प्यारा हिस्सा यही था कि वे हर दिन एक-दूसरे को चुनना चाहते थे।"}], "special_message": "टीना, तुम मेरी कहानी का सिर्फ एक पन्ना नहीं, बल्कि वह खूबसूरत एहसास हो जिसे मैं हर दिन जीना चाहता हूँ। ❤️ — तुम्हारा राज कुमार"}, "couple_quotes": ["राज कुमार + टीना = एक प्यारी-सी कहानी ❤️", "नाम दो हैं, मगर दुआ एक—हमेशा खुश रहें। 🥰", "हर प्रेम कहानी खास होती है, हमारी कहानी सबसे प्यारी है। 💞", "तेरा साथ मिले तो हर रास्ता खूबसूरत लगता है। 🌹", "मोहब्बत रोज़ जताने से नहीं, रोज़ निभाने से खूबसूरत बनती है। 🫶"], "teddy_image_info": {"file": "assets/images/teddy_love_collage.png", "note": "यह एक Teddy collage image है। नई 20 शायरियों के image field में यही फ़ाइल दी गई है।"}};
let current=0;const $=id=>document.getElementById(id);function put(id,value){$ (id).textContent=value||""}
function showShayari(i){const a=data.shayari||[];if(!a.length){put("shayariText","शायरी उपलब्ध नहीं है।");return}current=(i+a.length)%a.length;const s=a[current];put("shayariCounter",(current+1)+" / "+a.length);put("shayariTitle",s.title);put("shayariText",s.text);}
function render(){put("daily",data.love_messages?.[0]||"तुम मेरी सबसे प्यारी खुशी हो ❤️");put("nameList",(data.cute_names||[]).join(" • "));$("messageList").innerHTML="";
(data.love_messages||[]).forEach(m=>{const d=document.createElement("div");d.className="listitem";d.textContent=m;$("messageList").appendChild(d)});
const s=data.love_story||{};put("storyTitle",s.title);put("storySubtitle",s.subtitle);$("chapters").innerHTML="";
(s.chapters||[]).forEach(c=>{const w=document.createElement("div");w.className="listitem";const h=document.createElement("h3");h.textContent=c.title;const p=document.createElement("p");p.textContent=c.text;w.append(h,p);$("chapters").appendChild(w)});put("special",s.special_message);showShayari(0);}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("hidden",x.id!==b.dataset.tab))}));
$("nextShayari").onclick=()=>showShayari(current+1);$("prevShayari").onclick=()=>showShayari(current-1);
$("newMessage").onclick=()=>{const a=data.love_messages||[];if(a.length)put("daily",a[Math.floor(Math.random()*a.length)])};
$("randomName").onclick=()=>{const a=data.cute_names||[];if(a.length)put("randomNameOutput",a[Math.floor(Math.random()*a.length)])};
render();
</script></body></html>
